<script>
document.addEventListener("DOMContentLoaded", () => {

/* preorder form */
const form = document.getElementById("preorderForm");

if (form) {
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  console.log("klik działa"); // debug

  const data = new FormData(form);

  try {
    const res = await fetch("https://formsubmit.co/ajax/kr3tzkontakt@gmail.com", {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: data
    });

    console.log("wysłano", res);

    document.body.innerHTML = `
      <div style="
        position:fixed;
        inset:0;
        background:#0b0b0b;
        color:#fff;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        text-align:center;
        font-family:Arial;
      ">
        <h1>DZIĘKI ZA PREORDER</h1>
        <p>Twoje zamówienie zostało zapisane.</p>
        <small>Sprawdź maila.</small>
      </div>
    `;
  } catch (err) {
    console.error("błąd:", err);
    alert("Nie udało się wysłać formularza");
  }
});
}

/* cursor glow */
const glow=document.getElementById('cursorGlow');
document.addEventListener('mousemove',(e)=>{
  if(glow){
    glow.style.left=e.clientX+'px';
    glow.style.top=e.clientY+'px';
  }
});

/* booklet */
let currentPage=0;
const pages=document.querySelectorAll('.page');

function showPage(index){
  pages.forEach(p=>p.classList.remove('active'));
  if(pages[index]) pages[index].classList.add('active');
}

window.nextPage=function(){
  if(currentPage<pages.length-1){
    currentPage++;
    showPage(currentPage);
  }
}

window.prevPage=function(){
  if(currentPage>0){
    currentPage--;
    showPage(currentPage);
  }
}

/* fade */
const faders=document.querySelectorAll('.fade-in');
const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
    }
  });
});

faders.forEach(el=>observer.observe(el));

});
</script>
