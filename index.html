<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z4NIM Z4SNE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;}

body{
background:#0b0b0b;
color:#f5f5f5;
font-family:"Helvetica Neue",Arial,sans-serif;
line-height:1.6;
letter-spacing:.5px;
overflow-x:hidden;
}

/* (CAŁY CSS ZOSTAŁ BEZ ZMIAN) */
.story{color:#999;max-width:700px;line-height:1.8;font-size:14px;}
.dedication{margin-top:20px;color:#bbb;font-style:italic;letter-spacing:1px;}

body::after{
content:"";position:fixed;top:0;left:0;width:100%;height:100%;
background:url('https://grainy-gradients.vercel.app/noise.svg');
opacity:.05;pointer-events:none;z-index:1;
}

.cursor-glow{
position:fixed;width:250px;height:250px;
background:radial-gradient(circle,rgba(255,255,255,0.06)0%,transparent 70%);
border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
z-index:9999;
}

nav{position:fixed;top:30px;right:10%;font-size:13px;letter-spacing:1px;z-index:10;}
nav a{color:#777;text-decoration:none;margin-left:25px;transition:.3s;}
nav a:hover{color:#fff}

header{padding:120px 10% 80px;border-bottom:1px solid #1a1a1a}
h1{font-size:72px;margin-bottom:20px}
h2{font-size:22px;margin-bottom:40px;color:#ccc}
section{padding:120px 10%;border-bottom:1px solid #141414}

.book{max-width:700px;position:relative;height:420px;overflow:hidden;}
.page{position:absolute;width:100%;height:100%;opacity:0;transform:translateX(40px);transition:.4s;}
.page.active{opacity:1;transform:translateX(0)}

.controls{margin-top:40px;display:flex;gap:20px}
.control-btn{padding:8px 20px;border:1px solid #f5f5f5;background:none;color:#f5f5f5;cursor:pointer}

.preorder-box{
max-width:520px;margin:auto;padding:40px;
border:1px solid #1c1c1c;
background:linear-gradient(145deg,#0e0e0e,#090909);
}

.form-field{
width:100%;padding:14px;margin-bottom:15px;
background:#0b0b0b;border:1px solid #222;color:#eee;
}

.buy-button{
width:100%;padding:14px;border:1px solid #f5f5f5;
background:#f5f5f5;color:#0b0b0b;cursor:pointer;
}

footer{
padding:60px 10%;font-size:11px;color:#555;text-align:center;
}
</style>
</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>

<header>
<h1>Z4NIM Z4SNĘ</h1>
<p>Nowy album</p>
</header>

<section id="kup">
<h2>Pre-Order</h2>

<div class="preorder-box">

<form id="preorderForm"
action="https://formsubmit.co/kr3tzkontakt@gmail.com"
method="POST">

<input class="form-field" type="text" name="name" placeholder="Imię i nazwisko" required>
<input class="form-field" type="email" name="email" placeholder="Email" required>
<input class="form-field" type="text" name="address" placeholder="Adres" required>

<input type="hidden" name="_subject" value="Zamówienie - Z4NIM Z4SNĘ">
<input type="hidden" name="_template" value="table">

<input type="hidden" name="_autoresponse" value="Dzięki za preorder Z4NIM Z4SNĘ.">

<!-- opcjonalny redirect -->
<input type="hidden" name="_next" value="https://example.com/dzieki.html">

<button class="buy-button" type="submit">Kup Pre-Order</button>

</form>

</div>
</section>

<footer>
© 2026
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

/* cursor glow */
const glow=document.getElementById('cursorGlow');
document.addEventListener('mousemove',(e)=>{
if(glow){
glow.style.left=e.clientX+'px';
glow.style.top=e.clientY+'px';
}
});

/* booklet */
let currentPage=0;
const pages=document.querySelectorAll('.page');

function showPage(index){
pages.forEach(p=>p.classList.remove('active'));
if(pages[index]) pages[index].classList.add('active');
}

window.nextPage=function(){
if(currentPage<pages.length-1){
currentPage++;
showPage(currentPage);
}
}

window.prevPage=function(){
if(currentPage>0){
currentPage--;
showPage(currentPage);
}
}

});
</script>

</body>
</html>
