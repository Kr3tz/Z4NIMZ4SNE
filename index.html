<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z4NIM Z4SNE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#0b0b0b;
color:#f5f5f5;
font-family:"Helvetica Neue",Arial,sans-serif;
line-height:1.6;
letter-spacing:.5px;
overflow-x:hidden;
}

/* ===== INTRO ===== */
#intro{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10000;
cursor:pointer;
transition:opacity 1s ease;
}
#intro h1{
font-size:42px;
letter-spacing:6px;
margin-bottom:20px;
}
#intro p{
color:#777;
}

/* ===== GRAIN / STARS ===== */
body::after{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
pointer-events:none;
background-image:url('https://grainy-gradients.vercel.app/noise.svg');
opacity:0.05;
z-index:9998;
}

/* Cursor glow */
.cursor-glow{
position:fixed;
width:250px;
height:250px;
background:radial-gradient(circle,rgba(255,255,255,0.06)0%,transparent 70%);
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
}

/* NAV */
nav{
position:fixed;
top:30px;
right:10%;
font-size:13px;
}
nav a{
color:#777;
text-decoration:none;
margin-left:25px;
transition:.3s;
}
nav a.active,
nav a:hover{color:#fff}

/* HEADER */
header{
padding:120px 10% 80px;
border-bottom:1px solid #1a1a1a;
}

h1{
font-size:72px;
margin-bottom:20px;
position:relative;
}

/* GLITCH */
h1::before,
h1::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
opacity:0.3;
}

h1::before{
animation:glitch 2s infinite;
color:#f0f;
}
h1::after{
animation:glitch 2s infinite reverse;
color:#0ff;
}

@keyframes glitch{
0%{transform:translate(0)}
20%{transform:translate(-2px,2px)}
40%{transform:translate(-2px,-2px)}
60%{transform:translate(2px,2px)}
80%{transform:translate(2px,-2px)}
100%{transform:translate(0)}
}

section{
padding:120px 10%;
border-bottom:1px solid #141414;
}

/* BOOK */
.book{
max-width:700px;
min-height:260px;
overflow:hidden;
position:relative;
}

.page{
position:absolute;
width:100%;
opacity:0;
transform:translateX(40px);
transition:.5s;
}
.page.active{
opacity:1;
transform:translateX(0);
}

.page-content{
color:#aaa;
white-space:pre-line;
}

/* BUTTONS */
.controls{
margin-top:40px;
display:flex;
gap:20px;
}

.control-btn{
padding:8px 20px;
border:1px solid #f5f5f5;
background:none;
color:#f5f5f5;
cursor:pointer;
transition:.3s;
}
.control-btn:hover{
background:#fff;
color:#000;
}

/* PREORDER */
.preorder-box{
max-width:520px;
margin:auto;
padding:40px;
border:1px solid #1c1c1c;
background:linear-gradient(145deg,#0e0e0e,#090909);
box-shadow:0 0 40px rgba(0,0,0,.6);
transition:.4s;
}
.preorder-box:hover{
transform:translateY(-5px);
box-shadow:0 10px 60px rgba(0,0,0,.9);
}

.price{
text-align:center;
font-size:36px;
letter-spacing:4px;
margin-bottom:25px;
}

.form-field{
width:100%;
padding:14px;
margin-bottom:15px;
background:#0b0b0b;
border:1px solid #222;
color:#eee;
}

.buy-button{
width:100%;
padding:14px;
border:1px solid #fff;
background:#fff;
color:#000;
cursor:pointer;
letter-spacing:2px;
transition:.3s;
}
.buy-button:hover{
background:#ddd;
}

footer{
padding:60px 10%;
font-size:11px;
color:#555;
text-align:center;
}
</style>
</head>
<body>

<div id="intro">
<h1>Z4NIM Z4SNĘ</h1>
<p>kliknij aby wejść</p>
</div>

<div class="cursor-glow" id="cursorGlow"></div>

<nav>
<a href="#manifest">Info</a>
<a href="#booklet">Booklet</a>
<a href="#kup">Pre-Order</a>
</nav>

<header>
<h1 data-text="Z4NIM Z4SNĘ">Z4NIM Z4SNĘ</h1>
<p>Nowy początek. Nowi ludzie. Te same problemy.</p>
</header>

<section id="manifest">
<h2>Info</h2>
<p>Wejdź w głąb i sprawdź co siedzi mi w głowie.</p>
</section>

<section id="booklet">
<h2>Booklet</h2>

<div class="book">
<div class="page active"><div class="page-content">01 - W5TYD!</div></div>
<div class="page"><div class="page-content">02 - SI3DEM - JED3N</div></div>
<div class="page"><div class="page-content">03 - CZ4A BY ZASZŁ0 SŁ0ŃC3</div></div>
</div>

<div class="controls">
<button onclick="prevPage()" class="control-btn">Poprzednia</button>
<button onclick="nextPage()" class="control-btn">Następna</button>
</div>
</section>

<section id="kup">
<h2>Pre-Order</h2>

<div class="preorder-box">
<div class="price">6,66 PLN</div>
<button class="buy-button">ZAMAWIAM</button>
</div>
</section>

<footer>
© 2026 SBB — Z4NIM Z4SNĘ
</footer>

<script>
// INTRO
document.getElementById('intro').onclick=()=>{
document.getElementById('intro').style.opacity=0;
setTimeout(()=>document.getElementById('intro').style.display='none',1000);
};

// CURSOR
const glow=document.getElementById('cursorGlow');
document.addEventListener('mousemove',(e)=>{
glow.style.left=e.clientX+'px';
glow.style.top=e.clientY+'px';
});

// BOOK
let currentPage=0;
const pages=document.querySelectorAll('.page');

function showPage(i){
pages.forEach(p=>p.classList.remove('active'));
pages[i].classList.add('active');
}
function nextPage(){
if(currentPage<pages.length-1){
currentPage++;
showPage(currentPage);
}}
function prevPage(){
if(currentPage>0){
currentPage--;
showPage(currentPage);
}}

// NAV ACTIVE
const sections=document.querySelectorAll("section");
const navLinks=document.querySelectorAll("nav a");

window.addEventListener("scroll",()=>{
let current="";
sections.forEach(section=>{
const top=section.offsetTop;
if(scrollY>=top-200) current=section.getAttribute("id");
});
navLinks.forEach(a=>{
a.classList.remove("active");
if(a.getAttribute("href")==="#"+current){
a.classList.add("active");
}
});
});
</script>

</body>
</html>
